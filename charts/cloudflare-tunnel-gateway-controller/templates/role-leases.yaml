{{- if .Values.leaderElection.enabled }}
# Leader election is the controller's only Lease use, and it only ever touches
# the lease in the namespace deployment.yaml passes as
# --leader-election-namespace, so the grant is a Role there rather than a
# ClusterRole rule: cluster-wide Lease write would let a compromised
# controller take or delete other components' leader-election leases
# (kube-controller-manager, kube-scheduler, ...) and stall them. create is not
# scopable by resourceNames, so the Role covers the namespace's Leases rather
# than just {{ .Values.leaderElection.leaseName }}.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cf-tunnel-gw-ctrl.fullname" . }}-leases
  namespace: {{ .Values.leaderElection.namespace | default .Release.Namespace }}
  labels:
    {{- include "cf-tunnel-gw-ctrl.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cf-tunnel-gw-ctrl.fullname" . }}-leases
  namespace: {{ .Values.leaderElection.namespace | default .Release.Namespace }}
  labels:
    {{- include "cf-tunnel-gw-ctrl.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cf-tunnel-gw-ctrl.fullname" . }}-leases
subjects:
  - kind: ServiceAccount
    name: {{ include "cf-tunnel-gw-ctrl.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
