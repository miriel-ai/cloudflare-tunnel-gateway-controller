suite: test leases RBAC scoping
templates:
  - clusterrole.yaml
  - role-leases.yaml
tests:
  # A compromised controller holding cluster-wide Lease write could take or
  # delete other components' leader-election leases (kube-controller-manager,
  # kube-scheduler, ...) and stall those control loops. Leader election only
  # ever uses the lease in its configured namespace, so the grant must be a
  # namespaced Role there — never a ClusterRole rule. These assertions pin
  # that for every leaderElection setting.
  - it: should not grant leases in the ClusterRole with default values
    template: clusterrole.yaml
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["coordination.k8s.io"]
            resources: ["leases"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      - notContains:
          path: rules
          content:
            apiGroups: ["coordination.k8s.io"]
            resources: ["leases"]
          any: true

  - it: should not grant leases in the ClusterRole when leader election is enabled
    set:
      leaderElection:
        enabled: true
    asserts:
      - template: clusterrole.yaml
        notContains:
          path: rules
          content:
            apiGroups: ["coordination.k8s.io"]
            resources: ["leases"]
          any: true

  # Leader election off (the default): the controller never touches a Lease,
  # so no lease RBAC is rendered at all.
  - it: should render no leases Role or RoleBinding with default values
    template: role-leases.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a namespaced leases Role and RoleBinding when leader election is enabled
    set:
      leaderElection:
        enabled: true
    template: role-leases.yaml
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        isKind:
          of: Role
      - documentIndex: 0
        equal:
          path: metadata.name
          value: RELEASE-NAME-cloudflare-tunnel-gateway-controller-leases
      - documentIndex: 0
        equal:
          path: metadata.namespace
          value: NAMESPACE
      - documentIndex: 0
        contains:
          path: rules
          content:
            apiGroups: ["coordination.k8s.io"]
            resources: ["leases"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      - documentIndex: 1
        isKind:
          of: RoleBinding
      - documentIndex: 1
        equal:
          path: metadata.namespace
          value: NAMESPACE
      - documentIndex: 1
        equal:
          path: roleRef.kind
          value: Role
      - documentIndex: 1
        equal:
          path: roleRef.name
          value: RELEASE-NAME-cloudflare-tunnel-gateway-controller-leases
      - documentIndex: 1
        contains:
          path: subjects
          content:
            kind: ServiceAccount
            name: RELEASE-NAME-cloudflare-tunnel-gateway-controller
            namespace: NAMESPACE

  # The lease lives where --leader-election-namespace points, which
  # deployment.yaml sets to leaderElection.namespace when given. The Role must
  # follow the lease, or the elected namespace would be exactly the one the
  # controller cannot write in.
  - it: should place the leases Role in leaderElection.namespace when set
    set:
      leaderElection:
        enabled: true
        namespace: elections
    template: role-leases.yaml
    asserts:
      - documentIndex: 0
        equal:
          path: metadata.namespace
          value: elections
      - documentIndex: 1
        equal:
          path: metadata.namespace
          value: elections
      # The subject stays the controller's ServiceAccount in the release
      # namespace — only the Role moves with the lease.
      - documentIndex: 1
        contains:
          path: subjects
          content:
            kind: ServiceAccount
            name: RELEASE-NAME-cloudflare-tunnel-gateway-controller
            namespace: NAMESPACE
